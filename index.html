<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D 地形・洪水シミュレーション</title>
  <!-- Googleの3Dビューアーライブラリ -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background-color: #f0f0f0;
      overflow: hidden;
    }
    model-viewer {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <!-- 3Dモデル表示エリア -->
  <model-viewer 
    src="flood_model.glb" 
    alt="3D Flood Map" 
    camera-controls 
    auto-rotate 
    shadow-intensity="1"
    ar>
  </model-viewer>

</body>
</html>
